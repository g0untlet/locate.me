# AroundMe cache behavior in the IT suite.
# The production default (aroundme.read-from-cache=false) always fetches fresh
# from Geoapify; the suite keeps the cache-first path enabled so the cache-hit
# tests keep exercising it. The disabled path is covered by
# PlacesReadCacheDisabledIT via a @TestProfile override.
aroundme.read-from-cache=true

# Pin the general IT suite to a single category group so the existing
# one-Geoapify-call expectations stay valid. Grouped fetching is covered by
# PlacesCategoryGroupsIT via a @TestProfile override.
geoapify.categories=catering,commercial,healthcare,leisure,entertainment,service

# Bucket4j rate limiting disabled in the IT suite so existing integration tests
# are unaffected; RateLimitIT re-enables it with tiny limits via a @TestProfile
# override.
quarkus.rate-limiter.enabled=false

# The global external-API buckets are effectively disabled for the general IT
# suite (very high capacity, no blocking wait). ExternalApiRateLimitIT overrides
# them with tiny limits via a @TestProfile.
external-api.geoapify.requests=10000
external-api.nominatim.requests=10000
external-api.weather.requests=10000
external-api.max-wait-seconds=0
