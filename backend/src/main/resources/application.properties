# Graceful shutdown timeout
quarkus.shutdown.timeout=10s

# Uber Jar
quarkus.package.jar.type=uber-jar

# Database Configuration
quarkus.datasource.db-kind=h2
quarkus.datasource.username=sa
quarkus.datasource.password=sa
%prod.quarkus.datasource.jdbc.url=jdbc:h2:file:./data/locator;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
# Dev uses an in-memory database to prevent file locking issues
%dev.quarkus.datasource.jdbc.url=jdbc:h2:mem:locator_dev;DB_CLOSE_DELAY=-1

# Hibernate ORM Configuration
# Flyway owns the schema (baseline V1 == current 0.3.0 schema); Hibernate must not alter it.
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.sql-load-script=no-file

# Flyway Database Migrations
quarkus.flyway.migrate-at-start=true
# Existing non-empty databases (DEV/PROD) have no schema-history table yet; baseline them at
# version 1 so V1__baseline.sql is skipped and the existing data is left untouched.
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=1

# Test Database Configuration
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:locator_test;DB_CLOSE_DELAY=-1
%test.quarkus.http.test-port=0

# OpenAPI & Swagger UI Configuration
quarkus.swagger-ui.always-include=true

# HTTP Host Configuration
quarkus.http.host=0.0.0.0

# Port Configuration
%dev.quarkus.http.port=8090

# Dev-only CORS: allow the locally served frontend (python3 -m http.server 8000)
# to call the Quarkus backend cross-origin. Prod stays CORS-free (same-origin via Caddy).
%dev.quarkus.http.cors.enabled=true
%dev.quarkus.http.cors.origins=http://localhost:8000,http://127.0.0.1:8000

# OpenStreetMap Nominatim Client Configuration
nominatim_uri/mp-rest/url=https://nominatim.openstreetmap.org

# Open-Meteo Weather Client Configuration
weather_uri/mp-rest/url=https://api.open-meteo.com

# Geoapify Places Client Configuration
geoapify_uri/mp-rest/url=https://api.geoapify.com
# Top-level POI categories fetched from Geoapify AND the only categories used for
# a place's primary/secondary category (any other category is ignored when parsing).
geoapify.categories=catering,commercial,healthcare,leisure,entertainment,service
geoapify.limit=20
# Search radius (meters) for the Geoapify places request – big enough to
# populate the "Places around me" list in the PWA, small enough to stay local.
geoapify.radius=500
geoapify.format=json
geoapify.api-key=${GEOAPIFY_API_KEY:}

# Geoapify-Client-Timeouts (ms) – verhindern mehrsekündige Hänger bei einem
# degradierten Netzwerkpfad (Paketverlust). read-timeout ist ein Inactivity-
# Timeout (Abbruch, wenn länger keine Daten ankommen), kein Gesamtbudget.
# Überschreibbar per Env: GEOAPIFY_URI_MP_REST_READ_TIMEOUT (Default 10000)
# und GEOAPIFY_URI_MP_REST_CONNECT_TIMEOUT (Default 5000).
geoapify_uri/mp-rest/read-timeout=10000
geoapify_uri/mp-rest/connect-timeout=5000

# AroundMe Cache Configuration
# Radius (meters) of the geoboxing lookup used to serve cached places from the H2 cache.
# Must be >= geoapify.radius so places fetched for a neighborhood are served from
# cache on a repeat/nearby request (otherwise every request re-fetches from Geoapify).
aroundme.cache-radius=500

# Secondary POI categories to exclude from results (comma-separated, e.g. playground).
# Applied by the aroundme feature on both cache hits and fresh Geoapify fetches.
aroundme.exclude-categories=playground

# Maximum number of places returned for "Places around me" (response truncation;
# geoapify.limit still controls how many Geoapify fetches / how many are cached).
aroundme.max-places=20

# Whether places are served from the H2 cache (cache-first geoboxing lookup).
# When false, every request fetches fresh from Geoapify; the result is still
# upserted into the cache (so it stays populated) and forwarded to the client.
aroundme.read-from-cache=false

# Nur für echte/produktive IDs
allowed.user.ids=user123
# Zusätzliche IDs für Entwicklungs- und Test-Profile
%dev.allowed.user.ids=validUser,noAccuracyUser,geoUser,geoFailUser,stUser,user123
%test.allowed.user.ids=validUser,noAccuracyUser,geoUser,geoFailUser,stUser,user123

# Admin monitoring key (single alphanumeric value) protecting the stats endpoints
# (GET /api/positions/stats, GET /api/places/stats). Overridable via the ADMIN_KEY
# environment variable in production; dev/test profiles use their own fixed keys.
admin.key=${ADMIN_KEY:change-me}
%dev.admin.key=dev-admin-key
%test.admin.key=test-admin-key

# Bucket4j Rate Limiting
# Two per-user protection levels for the PWA REST services:
#   pwa-standard  – read operations (GET positions/current, GET positions, GET places)
#   pwa-critical  – write/delete operations (POST positions, DELETE positions)
# Both buckets are shared pools per user (shared=true) keyed by the userId query
# parameter (UserIdIdentityResolver). /api/system/info is deliberately NOT rate-limited
# so the frontend health/status probe never trips a 429.
quarkus.rate-limiter.buckets.pwa-standard.limits[0].permitted-uses=10
quarkus.rate-limiter.buckets.pwa-standard.limits[0].period=30s
quarkus.rate-limiter.buckets.pwa-standard.identity-resolver=net.gauntlet.locate.me.security.UserIdIdentityResolver
quarkus.rate-limiter.buckets.pwa-standard.shared=true
quarkus.rate-limiter.buckets.pwa-critical.limits[0].permitted-uses=5
quarkus.rate-limiter.buckets.pwa-critical.limits[0].period=30s
quarkus.rate-limiter.buckets.pwa-critical.identity-resolver=net.gauntlet.locate.me.security.UserIdIdentityResolver
quarkus.rate-limiter.buckets.pwa-critical.shared=true

%dev.quarkus.hibernate-orm.dev-ui.allow-hql=true

# Logging Configuration
# Konsolen-Loglevel auf DEBUG erhöhen, damit die Ausgaben im stdout landen
quarkus.log.console.level=DEBUG
# Spezifisches Loglevel für Ihr Projekt-Paket auf DEBUG setzen
quarkus.log.category."net.gauntlet.locate.me".level=DEBUG
# Quarkus-eigenes File-Logging deaktivieren (verhindert doppelten Schreibzugriff)
quarkus.log.file.enable=false


