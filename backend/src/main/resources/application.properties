# Graceful shutdown timeout
quarkus.shutdown.timeout=10s

# Uber Jar
quarkus.package.jar.type=uber-jar

# Database Configuration
quarkus.datasource.db-kind=h2
quarkus.datasource.username=sa
quarkus.datasource.password=sa
%prod.quarkus.datasource.jdbc.url=jdbc:h2:file:./data/locator;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
# Dev uses an in-memory database to prevent file locking issues
%dev.quarkus.datasource.jdbc.url=jdbc:h2:mem:locator_dev;DB_CLOSE_DELAY=-1

# Hibernate ORM Configuration
# Flyway owns the schema (baseline V1 == current 0.3.0 schema); Hibernate must not alter it.
# `schema-management.strategy=none` is the non-deprecated form of the former
# `quarkus.hibernate-orm.database.generation` (same enum, same default).
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.sql-load-script=no-file

# Flyway Database Migrations
quarkus.flyway.migrate-at-start=true
# Existing non-empty databases (DEV/PROD) have no schema-history table yet; baseline them at
# version 1 so V1__baseline.sql is skipped and the existing data is left untouched.
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=1

# Test Database Configuration
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:locator_test;DB_CLOSE_DELAY=-1
%test.quarkus.http.test-port=0

# OpenAPI & Swagger UI Configuration
quarkus.swagger-ui.always-include=true

# HTTP Host Configuration
quarkus.http.host=0.0.0.0
# Caddy terminates HTTPS and forwards the real client address. Trusting the
# forwarded address is required for the per-client authentication rate limits.
quarkus.http.proxy.proxy-address-forwarding=true

# Port Configuration
%dev.quarkus.http.port=8090

# Dev-only CORS: allow the locally served frontend (python3 -m http.server 8000)
# to call the Quarkus backend cross-origin. Prod stays CORS-free (same-origin via Caddy).
%dev.quarkus.http.cors.enabled=true
%dev.quarkus.http.cors.origins=http://localhost:8000,http://127.0.0.1:8000
# Bearer tokens are sent in the Authorization header by the locally served frontend.
%dev.quarkus.http.cors.access-control-allow-headers=Authorization,Content-Type,Accept

# OpenStreetMap Nominatim Client Configuration
nominatim_uri/mp-rest/url=https://nominatim.openstreetmap.org
# Reverse-geocoding request parameters (changeable without a rebuild).
nominatim.format=jsonv2
# Address granularity 0-18 (18 = building); lower values can yield a more stable label.
nominatim.zoom=18
# Nominatim reverse `layer` filter – which place themes are considered.
# Accepted values (comma-separated): address, poi, railway, natural, manmade.
# Defaults to address only; override without a rebuild via the NOMINATIM_LAYER
# env var, e.g. NOMINATIM_LAYER=address,poi.
nominatim.layer=address

# Open-Meteo Weather Client Configuration
weather_uri/mp-rest/url=https://api.open-meteo.com
# Client timeouts (ms), mirroring Geoapify, to prevent multi-second hangs on a degraded network path.
weather_uri/mp-rest/read-timeout=10000
weather_uri/mp-rest/connect-timeout=5000
# Requested Open-Meteo fields (comma-separated), changeable without a rebuild via env/system properties.
# current-fields feeds the current values, hourly-fields the forecast preview.
weather.current-fields=temperature_2m,weather_code,uv_index,is_day
weather.hourly-fields=temperature_2m,weather_code,uv_index,precipitation_probability,is_day
# Number of future hourly forecast timeslices returned (the current hour is skipped).
weather.forecast-hours=4
# Open-Meteo timestamp timezone: auto = the coordinates' local timezone, so forecast times
# match the local wall clock (Open-Meteo's default would be GMT).
weather.timezone=auto

# Geoapify Places Client Configuration
geoapify_uri/mp-rest/url=https://api.geoapify.com
# POI categories fetched from Geoapify AND the only categories used for a place's
# primary/secondary category (any other category is ignored when parsing).
# Category groups are separated by "|": each group triggers its own Geoapify
# request, and the results are combined and ordered by distance. A single group
# (no "|") preserves the original one-request behavior.
# Example: geoapify.categories=catering,commercial|healthcare,leisure,entertainment
geoapify.categories=catering,commercial,healthcare,leisure,entertainment,sport.fitness|accommodation.hotel,tourism.sights
# Maximum number of places requested from Geoapify per category group.
geoapify.limit=20
# Search radius (meters) for the Geoapify places request – big enough to
# populate the "Places around me" list in the PWA, small enough to stay local.
geoapify.radius=700
geoapify.format=json
geoapify.api-key=${GEOAPIFY_API_KEY:}

# Geoapify client timeouts (ms) – prevent multi-second hangs on a degraded
# network path (packet loss). read-timeout is an inactivity timeout (aborts
# when no data arrives for that long), not an overall budget.
# Overridable via env: GEOAPIFY_URI_MP_REST_READ_TIMEOUT (default 10000)
# and GEOAPIFY_URI_MP_REST_CONNECT_TIMEOUT (default 5000).
geoapify_uri/mp-rest/read-timeout=10000
geoapify_uri/mp-rest/connect-timeout=5000

# AroundMe Cache Configuration
# Radius (meters) of the geoboxing lookup used to serve cached places from the H2 cache.
# Must be >= geoapify.radius so places fetched for a neighborhood are served from
# cache on a repeat/nearby request (otherwise every request re-fetches from Geoapify).
aroundme.cache-radius=700

# Secondary POI categories to exclude from results (comma-separated, e.g. playground).
# Applied by the aroundme feature on both cache hits and fresh Geoapify fetches.
aroundme.exclude-categories=playground

# Maximum number of places returned per category group (response truncation).
# The total response cap is this value multiplied by the number of "|"-separated
# groups in geoapify.categories; geoapify.limit still controls how many are
# fetched per group and how many are cached.
aroundme.max-places=20

# Whether places are served from the H2 cache (cache-first geoboxing lookup).
# When false, every request fetches fresh from Geoapify; the result is still
# upserted into the cache (so it stays populated) and forwarded to the client.
aroundme.read-from-cache=false

# Legacy user bootstrap input (temporary). H2 is the authoritative user store;
# this list is read on EVERY startup to create missing unmigrated legacy accounts.
# An ID added here is imported at the next restart. Removing an ID never deletes,
# disables or revokes an existing account (deactivate it through the admin API).
# The exact identifier user123 is recognized as the permanent shared demo user
# and is deliberately not stored as a normal account.
allowed.user.ids=user123
# Additional IDs for dev and test profiles
%dev.allowed.user.ids=validUser,noAccuracyUser,geoUser,geoFailUser,stUser,legacyHero,adminUser,user123
%test.allowed.user.ids=validUser,noAccuracyUser,geoUser,geoFailUser,stUser,legacyHero,adminUser,user123

# Administrative user bootstrap (ops-controlled, env-var overridable in prod).
# ADMIN is granted to these existing accounts at startup; it is never revoked
# and no account is created from this list.
auth.admin.user.ids=
%dev.auth.admin.user.ids=adminUser
%test.auth.admin.user.ids=adminUser

# ------------------------------------------------------------------------------
# User Authentication
# ------------------------------------------------------------------------------
# JWT issuer/audience are verified on every bearer token. The lifetime applies
# to tokens issued by register/login/claim. Authentication is stateless: there
# are no sessions, no refresh tokens and no server-side revocation list.
auth.jwt.issuer=locate.me
auth.jwt.audience=locate.me-pwa
auth.jwt.lifespan=30d
mp.jwt.verify.issuer=locate.me
mp.jwt.verify.audiences=locate.me-pwa
# Signing key (RS256). Dev/test use the checked-in key material; PROD must point
# the locations at the mounted key files. Missing PROD key material fails startup
# rather than silently falling back to the development key.
%dev.smallrye.jwt.sign.key.location=jwt/dev-private.pem
%dev.mp.jwt.verify.publickey.location=jwt/dev-public.pem
%test.smallrye.jwt.sign.key.location=jwt/test-private.pem
%test.mp.jwt.verify.publickey.location=jwt/test-public.pem
%prod.smallrye.jwt.sign.key.location=${JWT_SIGN_KEY_LOCATION}
%prod.mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_LOCATION}

# Transitional compatibility: a legacy account without a password may still use
# the userId query parameter of the existing business endpoints. Migrated
# accounts (passwordHash set) and freshly registered users must send a bearer
# token. Set to false once the frontend has been migrated.
auth.legacy-userid-auth=true

# Operational gate for the one-time legacy claim (POST /api/auth/claim). Claim is
# the only public path that turns a known legacy id into an account, so a PROD
# deployment keeps it disabled (AUTH_CLAIM_ENABLED=false) until the frontend
# migration UI is live, then enables it for the cutover. Login, registration and
# migration-status are not affected.
auth.claim.enabled=${AUTH_CLAIM_ENABLED:true}

# Password policy (no silent truncation; bcrypt supports at most 72 UTF-8 bytes).
auth.password.min-length=8
auth.password.max-length=32
auth.password.bcrypt-cost=10
# Progressive temporary login cooldowns after auth.login.max-failed-attempts.
auth.login.max-failed-attempts=5
auth.login.cooldowns=1m,5m,15m

# Per-client authentication rate limits (Bucket4j, in-memory, per instance).
auth.rate-limit.login.permitted-uses=5
auth.rate-limit.login.period=1m
auth.rate-limit.registration.permitted-uses=3
auth.rate-limit.registration.period=1h
auth.rate-limit.claim.permitted-uses=5
auth.rate-limit.claim.period=1h
auth.rate-limit.migration-status.permitted-uses=10
auth.rate-limit.migration-status.period=1m
auth.rate-limit.demo.permitted-uses=20
auth.rate-limit.demo.period=1m

# Admin monitoring key (single alphanumeric value) protecting the stats endpoints
# (GET /api/positions/stats, GET /api/places/stats). Overridable via the ADMIN_KEY
# environment variable in production; dev/test profiles use their own fixed keys.
admin.key=${ADMIN_KEY:change-me}
%dev.admin.key=dev-admin-key
%test.admin.key=test-admin-key

# Bucket4j Rate Limiting
# Two per-user protection levels for the PWA REST services:
#   pwa-standard  – read operations (GET positions/current, GET positions, GET places)
#   pwa-critical  – write/delete operations (POST positions, DELETE positions)
# Both buckets are shared pools per user (shared=true) keyed by UserIdIdentityResolver:
# the verified JWT subject when authenticated, otherwise the legacy userId query
# parameter (the demo user is keyed by client address). /api/system/info is
# deliberately NOT rate-limited so the frontend health/status probe never trips a 429.
quarkus.rate-limiter.buckets.pwa-standard.limits[0].permitted-uses=10
quarkus.rate-limiter.buckets.pwa-standard.limits[0].period=30s
quarkus.rate-limiter.buckets.pwa-standard.identity-resolver=net.gauntlet.locate.me.security.UserIdIdentityResolver
quarkus.rate-limiter.buckets.pwa-standard.shared=true
quarkus.rate-limiter.buckets.pwa-critical.limits[0].permitted-uses=5
quarkus.rate-limiter.buckets.pwa-critical.limits[0].period=30s
quarkus.rate-limiter.buckets.pwa-critical.identity-resolver=net.gauntlet.locate.me.security.UserIdIdentityResolver
quarkus.rate-limiter.buckets.pwa-critical.shared=true

# Global protection for outgoing external API calls.
# These quotas are per external service (API key / source IP), not per user, so
# the buckets are shared by all users and are enforced immediately before each
# outgoing call. Calls may wait up to max-wait-seconds for a token; if none is
# available, the request is rejected with the standard 429 response.
# Geoapify allows 3 calls/second per API key; 2/second leaves a safety margin.
external-api.geoapify.requests=2
external-api.geoapify.period-seconds=1
# Nominatim usage policy: at most 1 request/second.
external-api.nominatim.requests=1
external-api.nominatim.period-seconds=1
# Open-Meteo is more generous; this protects against accidental bursts.
external-api.weather.requests=5
external-api.weather.period-seconds=1
external-api.max-wait-seconds=5

%dev.quarkus.hibernate-orm.dev-ui.allow-hql=true

# Logging Configuration
# Raise the console log level to DEBUG so output lands on stdout
quarkus.log.console.level=DEBUG
# Set the project package's log level to DEBUG
quarkus.log.category."net.gauntlet.locate.me".level=DEBUG
# Disable Quarkus's own file logging (prevents duplicate writes)
quarkus.log.file.enabled=false


