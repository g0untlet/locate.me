<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>locate.me</title>
    <script>
        const APP_VERSION = '0.3.0';
        const APP_BUILD   = '20260811';
        document.documentElement.dataset.theme = localStorage.getItem('theme') || 'light';
    </script>
    <link rel="stylesheet" href="css/style.css?v=0.3.0_11">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" integrity="sha512-h9FcoyWjHcOcmEVkxOfTLnmZFWIH0iZhZT1H2TbOq55xssQGEJHEaIm+PgoUaZbRvQTNTluNOEfb1ZRy6D3BOw==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" integrity="sha512-puJW3E/qXDqYp9IfhAI54BJEaWIfloJ7JWs7OeD5i6ruC9JZL1gERT1wjtwXFlh7CjE7ZJ+/vcRZRkIYIb6p4g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>
    <script type="module" src="app.js?v=0.3.0_15"></script>

    <div class="app-container">
        <header class="app-header">
            <h1 class="app-title">locate<span class="title-accent">.me</span></h1>
            <div class="header-status-indicator" title="Application Online">
                <span class="status-dot"></span>
            </div>
        </header>
        
        <section id="page-locate" class="app-page">
            <div class="locate-action-group">
                <button id="btn-fetch-location" class="track-btn">
                    FETCH LOCATION
                </button>
                <button id="track-btn" class="track-btn track-btn--save" style="display: none;">
                    SAVE LOCATION
                </button>
            </div>

            <div class="status-container">
                <div id="status" class="status-ready">Ready</div>
            </div>

            <div id="save-options" class="save-options hidden">
                <button id="save-options-toggle" class="save-options-toggle" type="button" aria-expanded="false">
                    <svg class="save-options-toggle-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.83z"></path>
                        <line x1="7" y1="7" x2="7.01" y2="7"></line>
                    </svg>
                    <span class="save-options-toggle-label">TAG &amp; COMMENT</span>
                    <span id="save-options-summary" class="save-options-summary hidden"></span>
                    <svg class="save-options-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                </button>
                <div class="save-options-body">
                    <div class="save-options-inner">
                        <div class="save-options-row">
                            <span class="label">TAG</span>
                            <div id="tag-chips" class="tag-chips"></div>
                        </div>
                        <div class="save-options-row">
                            <span class="label">COMMENT</span>
                            <div class="comment-input-wrapper">
                                <input id="comment-input" class="comment-input" type="text"
                                       maxlength="25" placeholder="Add a comment (optional)…" autocomplete="off">
                                <span id="comment-counter" class="comment-counter">0/25</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="response-card" class="response-card hidden">
                <div class="flex-rows">
                    <div id="res-tag-comment" class="res-tag-comment border-bottom hidden">
                        <span id="res-tag-pill" class="res-tag-pill hidden"></span>
                        <span id="res-comment-text" class="res-comment-text"></span>
                    </div>
                    <div class="row-split border-bottom">
                        <div class="cell">
                            <span class="label">TEMPERATURE</span>
                            <div class="temp-display-wrapper">
                                <span id="res-weather-icon-container"></span>
                                <span id="res-temp" class="value">-</span>
                            </div>
                        </div>
                        <div class="cell text-right">
                            <span class="label">CONDITION</span>
                            <span id="res-weather" class="value">-</span>
                        </div>
                        <div class="cell text-right">
                            <span class="label">UV-INDEX</span>
                            <span id="res-uv" class="value">-</span>
                        </div>
                    </div>
                    <div class="row-split">
                        <div class="cell address-cell">
                            <span class="label">RESOLVED ADDRESS</span>
                            <div id="res-address-container" class="value address-container">-</div>
                        </div>
                        <div class="cell text-right elevation-cell">
                            <span class="label">ELEVATION</span>
                            <span id="res-elevation" class="value">-</span>
                        </div>
                    </div>
                    <div class="row-full">
                        <div id="locate-map" class="locate-map"></div>
                    </div>
                </div>
            </div>
        </section>

        <section id="page-history" class="app-page hidden">
            <div class="history-view-toggle">
                <button id="toggle-list-btn" class="view-toggle-btn view-toggle-btn--active">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="8" y1="6" x2="21" y2="6"></line>
                        <line x1="8" y1="12" x2="21" y2="12"></line>
                        <line x1="8" y1="18" x2="21" y2="18"></line>
                        <line x1="3" y1="6" x2="3.01" y2="6"></line>
                        <line x1="3" y1="12" x2="3.01" y2="12"></line>
                        <line x1="3" y1="18" x2="3.01" y2="18"></line>
                    </svg>
                    List
                </button>
                <button id="toggle-map-btn" class="view-toggle-btn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"></polygon>
                        <line x1="9" y1="3" x2="9" y2="18"></line>
                        <line x1="15" y1="6" x2="15" y2="21"></line>
                    </svg>
                    Map
                </button>
            </div>
            <div id="history-list" class="history-list">
            </div>
            <div id="history-map" class="history-map hidden"></div>
        </section>

        <section id="page-settings" class="app-page hidden">
            <div class="settings-card">
                <h2 class="settings-title">Application Settings</h2>
                <div class="form-group">
                    <label class="label">APPEARANCE</label>
                    <div class="toggle-row">
                        <span class="toggle-label">Dark Mode</span>
                        <button id="dark-mode-toggle" class="toggle-switch" role="switch" aria-checked="false" aria-label="Toggle dark mode">
                            <span class="toggle-knob"></span>
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="username-input" class="label">USER ID</label>
                    <div class="input-with-icon">
                        <input type="password" id="username-input" class="settings-input" placeholder="user123">
                        <button type="button" id="toggle-password-btn" class="toggle-password-trigger" aria-label="Toggle user ID visibility">
                            <svg class="eye-icon" id="eye-icon-visible" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                            <svg class="eye-icon hidden" id="eye-icon-hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                <line x1="1" y1="1" x2="23" y2="23"></line>
                            </svg>
                        </button>
                    </div>
                    <small class="help-text">Left blank, "user123" will be used by default.</small>
                </div>
                <button id="save-settings-btn" class="track-btn">SAVE SETTINGS</button>
                <div id="settings-status" class="settings-status"></div>
                
                <div class="attribution-block">
                    <span class="attribution-label">VERSION</span>
                    <div class="attribution-links">
                        <span id="app-version-display" class="attribution-link"></span>
                    </div>
                    <div id="backend-info" class="attribution-block" style="border-top: none; margin-top: 6px; padding-top: 0;"></div>
                </div>
                <script>
                    document.getElementById('app-version-display').textContent = APP_VERSION + ' (' + APP_BUILD + ')';
                </script>

                <div class="attribution-block">
                    <span class="attribution-label">POWERED BY</span>
                    <div class="attribution-links">
                        <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener" class="attribution-link">
                            © OpenStreetMap
                        </a>
                        <a href="https://leafletjs.com" target="_blank" rel="noopener" class="attribution-link">
                            Leaflet
                        </a>
                        <a href="https://open-meteo.com" target="_blank" rel="noopener" class="attribution-link">
                            Open-Meteo
                        </a>
                    </div>
                </div>
            </div>
        </section>

        <nav class="bottom-nav">
            <button class="nav-item active" data-target="page-locate">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                    <circle cx="12" cy="10" r="3"></circle>
                </svg>
                <span class="nav-label">Locate</span>
            </button>
            
            <button class="nav-item" data-target="page-history">
                <div class="nav-icon-wrapper">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <polyline points="12 6 12 12 16 14"></polyline>
                    </svg>
                    <span id="history-badge" class="nav-badge" style="display: none;">0</span>
                </div>
                <span class="nav-label">History</span>
            </button>
            
            <button class="nav-item" data-target="page-settings">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
                <span class="nav-label">Settings</span>
            </button>
        </nav>
    </div>

</body>

</html>
